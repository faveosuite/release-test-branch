name: Release Pipeline

on:
  release:
    types: [published]

jobs:
  # ---------------------------------------------------------------
  # Triggered automatically when a GitHub release is published.
  # Derives release type from the tag name, then triggers Jenkins.
  # ---------------------------------------------------------------
  trigger-jenkins:
    runs-on: ubuntu-latest

    steps:
      - name: Derive release type from tag
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"

          if echo "$TAG" | grep -qi '\.RC\.'; then
            RELEASE_TYPE="prerelease"
          elif echo "$TAG" | grep -qi '\.B\.'; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="official"
          fi

          echo "Tag: $TAG | Title: $TITLE | Type: $RELEASE_TYPE"
          echo "tag=$TAG"            >> $GITHUB_OUTPUT
          echo "title=$TITLE"        >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Trigger Jenkins build and wait
        id: jenkins
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TITLE="${{ steps.vars.outputs.title }}"
          RELEASE_TYPE="${{ steps.vars.outputs.release_type }}"

          # Encode params for URL query string
          ENCODED_TAG=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TAG")
          ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          ENCODED_TYPE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$RELEASE_TYPE")

          JENKINS_URL="${{ secrets.JENKINS_TRIGGER_URL }}?tag_name=${ENCODED_TAG}&release_title=${ENCODED_TITLE}&release_type=${ENCODED_TYPE}"

          # Trigger the build, capture the queue URL from Location header
          QUEUE_URL=$(curl -s -o /dev/null -w "%{redirect_url}" -X POST "$JENKINS_URL" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --fail -L)

          if [ -z "$QUEUE_URL" ]; then
            QUEUE_URL=$(curl -s -D - -o /dev/null -X POST "$JENKINS_URL" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
          fi

          echo "Queue URL: $QUEUE_URL"

          # Poll queue until build number is assigned (up to 10 min)
          BUILD_URL=""
          for i in $(seq 1 60); do
            sleep 10
            BUILD_URL=$(curl -s "${QUEUE_URL}api/json" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('executable',{}).get('url',''))" 2>/dev/null)
            if [ -n "$BUILD_URL" ]; then break; fi
          done

          if [ -z "$BUILD_URL" ]; then
            echo "::error::Jenkins job did not start within 10 minutes ? check executor availability"
            exit 1
          fi

          echo "Build URL: $BUILD_URL"
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

          # Poll build until complete (up to 30 min)
          for i in $(seq 1 180); do
            sleep 10
            RESULT=$(curl -s "${BUILD_URL}api/json" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result') or 'IN_PROGRESS')" 2>/dev/null)
            echo "Jenkins status: $RESULT"
            if [ "$RESULT" != "IN_PROGRESS" ] && [ "$RESULT" != "null" ] && [ -n "$RESULT" ]; then break; fi
          done

          echo "Final Jenkins result: $RESULT"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

          if [ "$RESULT" != "SUCCESS" ]; then
            echo "::error::Jenkins build failed with result: $RESULT"
            exit 1
          fi

      - name: Notify Google Chat on success
        if: success()
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          webhooks = [w.strip() for w in "${{ secrets.GOOGLE_CHAT_WEBHOOK_SUCCESS }}".split(",") if w.strip()]

          if not webhooks:
              print("GOOGLE_CHAT_WEBHOOK_SUCCESS not configured, skipping.")
          else:
              title   = "${{ steps.vars.outputs.title }}"
              run_url = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}"
              text    = f"*{title}*\n\n<{run_url}|View Release>"
              payload = json.dumps({"text": text}).encode()

              for webhook in webhooks:
                  req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req)
          EOF

      - name: Notify Google Chat on failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          webhook   = "${{ secrets.GOOGLE_CHAT_WEBHOOK_FAILURE }}"
          result    = "${{ steps.jenkins.outputs.result }}" or "unknown"
          build_url = "${{ steps.jenkins.outputs.build_url }}" or "N/A"
          run_url   = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if not webhook.strip():
              print("GOOGLE_CHAT_WEBHOOK_FAILURE not configured, skipping.")
              exit(0)

          text = (
              f"*Release: ${{ steps.vars.outputs.title }}* FAILED\n"
              f"*Jenkins result:* {result}\n"
              f"*Jenkins build:* {build_url}\n"
              f"*GitHub run:* {run_url}"
          )

          payload = json.dumps({"text": text}).encode()
          req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          EOF
