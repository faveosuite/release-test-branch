name: Release Pipeline

# run-name embeds the Faveo release ID so the workflow_run webhook
# can identify which release to update (parsed as [faveo:ID]).
run-name: "Release ${{ inputs.version }} [faveo:${{ inputs.release_id }}]"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / tag name (e.g. v9.4.34)'
        required: true
      subject:
        description: 'Release title'
        required: false
        default: ''
      description:
        description: 'Release notes'
        required: false
        default: ''
      release_id:
        description: 'Faveo release ID (injected automatically)'
        required: false
        default: ''

jobs:
  # ---------------------------------------------------------------
  # Job 1: Create and publish the GitHub release.
  # Branch is determined by the ref used to dispatch the workflow
  # (set by Faveo from the configured default_branch).
  # ---------------------------------------------------------------
  publish-release:
    runs-on: ubuntu-latest

    outputs:
      release_type: ${{ steps.vars.outputs.release_type }}

    steps:
      - name: Derive release type and publish GitHub release
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          SUBJECT="${{ inputs.subject }}"
          # Derive release type from version string
          if echo "$VERSION" | grep -qi '\.RC\.'; then
            RELEASE_TYPE="prerelease"
            PRERELEASE_FLAG="--prerelease"
          elif echo "$VERSION" | grep -qi '\.B\.'; then
            RELEASE_TYPE="beta"
            PRERELEASE_FLAG="--prerelease"
          else
            RELEASE_TYPE="official"
            PRERELEASE_FLAG=""
          fi

          echo "Version: $VERSION | Type: $RELEASE_TYPE"
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

          # Write release notes to a file to safely handle special characters
          cat > /tmp/release_notes.md << 'NOTES_EOF'
          ${{ inputs.description }}
          NOTES_EOF

          # Create or update the GitHub release
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $VERSION already exists — updating."
            gh release edit "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$SUBJECT" \
              --notes-file /tmp/release_notes.md \
              $PRERELEASE_FLAG
          else
            echo "Creating new release $VERSION."
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --target "master" \
              --title "$SUBJECT" \
              --notes-file /tmp/release_notes.md \
              $PRERELEASE_FLAG
          fi

  # ---------------------------------------------------------------
  # Job 2: Trigger Jenkins build and wait for result.
  # Runs after the GitHub release is published.
  # ---------------------------------------------------------------
  trigger-jenkins:
    needs: publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins build and wait
        id: jenkins
        run: |
          TAG="${{ inputs.version }}"
          TITLE="${{ inputs.subject }}"
          RELEASE_TYPE="${{ needs.publish-release.outputs.release_type }}"

          # Encode params for URL query string
          ENCODED_TAG=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TAG")
          ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          ENCODED_TYPE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$RELEASE_TYPE")

          JENKINS_URL="${{ secrets.JENKINS_TRIGGER_URL }}?tag_name=${ENCODED_TAG}&release_title=${ENCODED_TITLE}&release_type=${ENCODED_TYPE}"

          # Trigger the build, capture the queue URL from Location header
          QUEUE_URL=$(curl -s -o /dev/null -w "%{redirect_url}" -X POST "$JENKINS_URL" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --fail -L)

          if [ -z "$QUEUE_URL" ]; then
            QUEUE_URL=$(curl -s -D - -o /dev/null -X POST "$JENKINS_URL" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
          fi

          echo "Queue URL: $QUEUE_URL"

          # Poll queue until build number is assigned (up to 10 min)
          BUILD_URL=""
          for i in $(seq 1 60); do
            sleep 10
            BUILD_URL=$(curl -s "${QUEUE_URL}api/json" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('executable',{}).get('url',''))" 2>/dev/null)
            if [ -n "$BUILD_URL" ]; then break; fi
          done

          if [ -z "$BUILD_URL" ]; then
            echo "::error::Jenkins job did not start within 10 minutes — check executor availability"
            exit 1
          fi

          echo "Build URL: $BUILD_URL"
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

          # Poll build until complete (up to 30 min)
          for i in $(seq 1 180); do
            sleep 10
            RESULT=$(curl -s "${BUILD_URL}api/json" \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result') or 'IN_PROGRESS')" 2>/dev/null)
            echo "Jenkins status: $RESULT"
            if [ "$RESULT" != "IN_PROGRESS" ] && [ "$RESULT" != "null" ] && [ -n "$RESULT" ]; then break; fi
          done

          echo "Final Jenkins result: $RESULT"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

          if [ "$RESULT" != "SUCCESS" ]; then
            echo "::error::Jenkins build failed with result: $RESULT"
            exit 1
          fi

      - name: Notify Google Chat on success
        if: success()
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          webhooks = [w.strip() for w in "${{ secrets.GOOGLE_CHAT_WEBHOOK_SUCCESS }}".split(",") if w.strip()]

          if not webhooks:
              print("GOOGLE_CHAT_WEBHOOK_SUCCESS not configured, skipping.")
          else:
              title   = "${{ inputs.subject }}"
              run_url = "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}"
              text    = f"*{title}*\n\n<{run_url}|View Release>"
              payload = json.dumps({"text": text}).encode()

              for webhook in webhooks:
                  req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req)
          EOF

      - name: Notify Google Chat on failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          webhook   = "${{ secrets.GOOGLE_CHAT_WEBHOOK_FAILURE }}"
          result    = "${{ steps.jenkins.outputs.result }}" or "unknown"
          build_url = "${{ steps.jenkins.outputs.build_url }}" or "N/A"
          run_url   = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if not webhook.strip():
              print("GOOGLE_CHAT_WEBHOOK_FAILURE not configured, skipping.")
              exit(0)

          text = (
              f"*Release: ${{ inputs.subject }}* FAILED\n"
              f"*Jenkins result:* {result}\n"
              f"*Jenkins build:* {build_url}\n"
              f"*GitHub run:* {run_url}"
          )

          payload = json.dumps({"text": text}).encode()
          req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          EOF
